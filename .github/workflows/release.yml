name: Build and Release

# 推送 v* 格式的 tag 时构建独立定制版安装包
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Ad Hoc DMG
        run: ./scripts/build-local.sh "${GITHUB_REF_NAME}"

      - name: Prepare Release Notes
        run: awk '/^## / { count++; if (count == 2) exit } { print }' CHANGELOG.md > dist/release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: dist/KimiCodeBar-*-macOS.dmg
